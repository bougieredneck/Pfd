<style>
  :root {
    --bg: #0c0b09;
    --bg-deep: #070706;
    --card: #16130f;
    --card-2: #1c1812;
    --line: rgba(240, 193, 75, 0.18);
    --line-strong: rgba(240, 193, 75, 0.45);
    --gold: #f0c14b;
    --gold-2: #ffe7a8;
    --fire: #ff5a1f;
    --cream: #f4efe4;
    --muted: #b7ad9c;
    --dim: #8a8172;
    --danger: #ff8a62;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg-deep); }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100dvh;
    color: var(--cream);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button, input, select { font: inherit; color: inherit; touch-action: manipulation; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .app {
    width: min(480px, 100%);
    min-height: 100dvh;
    margin: 0 auto;
    background:
      radial-gradient(900px 320px at 50% -40px, rgba(255, 120, 30, 0.18), transparent 60%),
      var(--bg);
    box-shadow: 0 0 0 1px rgba(240, 193, 75, 0.08);
  }
  main {
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
  }
  .brand {
    margin: 0;
    color: var(--gold);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .when {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }
  .hero-top, .subtop {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .blessing {
    margin: 14px 0 16px;
    font-size: clamp(1.7rem, 7.6vw, 2.15rem);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 0.95;
    text-wrap: balance;
  }
  .score-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .ring-wrap {
    position: relative;
    width: 118px;
    height: 118px;
    flex: 0 0 118px;
  }
  .ring-wrap svg { width: 100%; height: 100%; display: block; }
  .ring-track { fill: none; stroke: #2a2418; stroke-width: 10; }
  .ring-fg {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
  }
  .ring-wrap.is-perfect .ring-fg { filter: drop-shadow(0 0 6px rgba(255, 90, 31, 0.85)); }
  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  .ring-label strong {
    font-size: 2.5rem;
    line-height: 0.85;
    letter-spacing: -0.04em;
  }
  .ring-label span { color: var(--muted); font-weight: 700; font-size: 0.95rem; }
  .score-side { flex: 1; min-width: 0; }
  .score-caption {
    margin: 0 0 8px;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    border-radius: 14px;
    background: #1a1712;
    border: 1px solid var(--line);
  }
  .switch button {
    min-height: 44px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
  }
  .switch button[aria-pressed="true"] {
    background: var(--gold);
    color: #1a1206;
  }
  .perfect {
    margin: 12px 0 0;
    padding: 10px 12px;
    border-radius: 12px;
    background: linear-gradient(90deg, rgba(255, 90, 31, 0.22), rgba(240, 193, 75, 0.18));
    border: 1px solid var(--line-strong);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-align: center;
  }
  .burst {
    position: absolute;
    left: 55px;
    top: 55px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    background: var(--gold-2);
    animation: burst 0.7s ease-out forwards;
  }
  @keyframes burst {
    0% { box-shadow: 0 0 0 0 var(--gold); opacity: 1; }
    100% {
      box-shadow:
        42px -18px 0 -1px var(--fire),
        -40px -22px 0 -1px var(--gold),
        18px 40px 0 -1px var(--gold-2),
        -22px 36px 0 -1px var(--fire),
        48px 16px 0 -2px var(--gold),
        -46px 8px 0 -2px var(--gold-2),
        8px -46px 0 -1px var(--fire),
        -8px -40px 0 -2px var(--gold);
      opacity: 0;
    }
  }
  .poc { margin-top: 16px; }
  .poc-top, .row-between {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .poc-top h2, .kicker, .group, .eyebrow {
    margin: 0;
    color: var(--gold);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .poc-top strong { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
  .bar {
    height: 14px;
    margin-top: 8px;
    border-radius: 999px;
    background: #2a2418;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--fire), var(--gold) 58%, var(--gold-2));
    transition: width 0.45s cubic-bezier(.2, .8, .2, 1);
  }
  .hint { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.35; }
  .hint.error { color: var(--danger); font-weight: 700; }
  .group-block { margin-top: 18px; }
  .group {
    display: flex;
    justify-content: space-between;
    margin: 0 0 8px;
  }
  .group span {
    color: var(--dim);
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 68px;
    margin: 0 0 8px;
    padding: 12px 14px;
    text-align: left;
    color: var(--cream);
    background: var(--card);
    border: 1px solid rgba(240, 193, 75, 0.12);
    border-radius: 16px;
    user-select: none;
  }
  .item:active { transform: scale(0.985); }
  .item.is-on {
    border-color: var(--line-strong);
    background: linear-gradient(90deg, rgba(240, 193, 75, 0.18), var(--card) 72%);
  }
  .box {
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    border: 2px solid #8a7040;
    background: transparent;
  }
  .box svg { width: 22px; height: 22px; display: block; }
  .box path {
    fill: none;
    stroke: #1a1206;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 24;
    stroke-dashoffset: 24;
  }
  .item.is-on .box {
    border-color: transparent;
    background: linear-gradient(160deg, #ffe7a8, #f0c14b 46%, #ff5a1f);
    box-shadow: 0 0 16px rgba(255, 140, 40, 0.35);
  }
  .item.is-on .box path { stroke-dashoffset: 0; }
  .item.just.is-on .box { animation: pop 0.34s cubic-bezier(.2, 1.5, .3, 1); }
  .item.just.is-on .box path { animation: draw 0.28s ease forwards; }
  @keyframes pop {
    0% { transform: scale(0.7); }
    65% { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .item-label { flex: 1; font-size: 1.05rem; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .poc-tag {
    flex: 0 0 auto;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--gold);
    color: #1a1206;
    font-style: normal;
    font-size: 12px;
    font-weight: 800;
  }
  .friday, .panel, .streak-hero article, .log-row, .edit-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
  }
  .friday {
    margin-top: 16px;
    padding: 14px;
    background:
      linear-gradient(180deg, rgba(255, 90, 31, 0.16), transparent 48%),
      var(--card);
  }
  .friday form .hint { grid-column: 1 / -1; }
  .sheet { position: relative; }
  .sheet-actions { display: flex; align-items: center; gap: 8px; }
  .friday h2, .screen-title, .sheet h2 {
    margin: 4px 0 10px;
    font-size: 1.7rem;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .weigh-form, .friday form {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: end;
  }
  .weigh-form { grid-template-columns: 1fr 1fr; }
  .weigh-form button, .friday button[type="submit"], .btn, .file-btn {
    min-height: 52px;
    border: 0;
    border-radius: 14px;
    background: var(--gold);
    color: #1a1206;
    font-weight: 800;
    padding: 0 16px;
  }
  .weigh-form button { grid-column: 1 / -1; }
  label.field { display: block; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  input, select {
    width: 100%;
    margin-top: 6px;
    min-height: 52px;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--line-strong);
    background: #100e0b;
    color: var(--cream);
  }
  .iam { margin-top: 22px; }
  .iam-toggle {
    width: 100%;
    min-height: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-radius: 16px;
    border: 1px solid var(--line-strong);
    background: #14110d;
    color: var(--gold-2);
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .iam-body {
    margin-top: 8px;
    padding: 16px;
    border-radius: 16px;

<body>
  <div class="app">
    <div id="toast" class="toast" hidden role="status"></div>
    <main id="main"></main>
  </div>
  <nav class="tabbar" aria-label="Primary">

    <button type="button" class="tab" data-action="nav" data-view="streaks"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5s4.2 4.2 4.2 8.1a4.2 4.2 0 0 1-8.4 0c0-1.6.8-3 1.5-3.8C8.4 8.6 8 10.6 9.4 12c-.2-2.2.8-4.8 2.6-9.5Z"/></svg>Streak</button>
    <button type="button" class="tab" data-action="nav" data-view="history"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>History</button>
    <button type="button" class="tab" data-action="nav" data-view="weight"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5 9 11l3.2 3.2L20 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Weight</button>
    <button type="button" class="tab" data-action="nav" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="8" r="2.2" fill="currentColor"/><circle cx="15" cy="16" r="2.2" fill="currentColor"/></svg>Settings</button>
  </nav>
  <div id="sheet"></div>
  <noscript><p class="noscript">Turn JavaScript on. This page runs on your phone and does not use a server.</p></noscript>
<script>
(function () {
  var KEY = "prizefighter-day-v1";
  var GROUPS = ["PERSONAL", "PROFESSIONAL", "SERVICE", "DISCIPLINE"];
  var WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DEFAULT_ITEMS = [
    { id: "prayer", group: "PERSONAL", label: "Daily prayer" },
    { id: "nutrition", group: "PERSONAL", label: "-1 nutrition (one thing off my plate)" },
    { id: "body", group: "PERSONAL", label: "Moved my body" },
    { id: "journal", group: "PERSONAL", label: "Journaled \"I am 275\"" },
    { id: "pocs", group: "PROFESSIONAL", label: "2 POCs", pocs: 2 },
    { id: "touch", group: "PROFESSIONAL", label: "Unexpected intentional touch" },
    { id: "team", group: "PROFESSIONAL", label: "Team did 1" },
    { id: "kindness", group: "SERVICE", label: "Random act of kindness" },
    { id: "ben", group: "DISCIPLINE", label: "Daily text to Ben" },
    { id: "heu", group: "DISCIPLINE", label: "High Energy Units" }
  ];

  var state;
  var deferredPrompt = null;
  var ui = {
    view: "today",
    dayOffset: 0,
    month: null,
    sheetDate: null,
    justKey: "",
    iamOpen: false,
    canInstall: false,
    importError: "",
    ringFrom: null,
    celebrate: false
  };

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function uid() {
    return "i" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
  }

  function dateKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function parseKey(key) {
    var parts = key.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function addDays(key, n) {
    var d = parseKey(key);
    d.setDate(d.getDate() + n);
    return dateKey(d);
  }

  function todayKey() {
    return dateKey(new Date());
  }

  function pretty(key) {
    var d = parseKey(key);
    return WEEKDAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
  }

  function shortDate(key) {
    var d = parseKey(key);
    return MONTHS[d.getMonth()] + " " + d.getDate();
  }

  function isFriday(key) {
    return parseKey(key).getDay() === 5;
  }

  function round1(n) {
    return Math.round(Number(n) * 10) / 10;
  }

  function formatLbs(n) {
    var r = round1(n);
    return Number.isInteger(r) ? String(r) : r.toFixed(1);
  }

  function clampNum(value, min, max, fallback) {
    var n = Number(value);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function fresh() {
    return {
      version: 1,
      items: DEFAULT_ITEMS.map(function (item) { return Object.assign({}, item); }),
      days: {},
      weights: [],
      startWeight: 302,
      goalWeight: 275,
      pocGoal: 500,
      pocBaseline: 0,
      startedOn: todayKey()
    };
  }

  function normalize(raw, strict) {
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) {
      if (strict) throw new Error("That file is not a Prize Fighter backup.");
      return fresh();
    }
    var base = fresh();
    if (!Array.isArray(raw.items) || !raw.items.length) {
      if (strict) throw new Error("The backup has no habit items.");
    } else {
      var items = [];
      var seen = {};
      raw.items.forEach(function (item) {
        if (!item || typeof item.label !== "string" || !item.label.trim()) {
          if (strict) throw new Error("An item is missing a name.");
          return;
        }
        if (GROUPS.indexOf(item.group) === -1) {
          if (strict) throw new Error("An item has an unknown group.");
          return;
        }
        var id = String(item.id || "");
        if (!id || seen[id]) id = uid();
        seen[id] = true;
        var next = { id: id, group: item.group, label: item.label.trim().slice(0, 80) };
        var pocs = Math.round(Number(item.pocs));
        if (pocs > 0) next.pocs = Math.min(99, pocs);
        items.push(next);
      });
      if (!items.length) {
        if (strict) throw new Error("The backup has no habit items.");
      } else {
        base.items = items.slice(0, 24);
      }
    }
    if (raw.days && typeof raw.days === "object" && !Array.isArray(raw.days)) {
      var days = {};
      Object.keys(raw.days).forEach(function (key) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) return;
        var src = raw.days[key] && raw.days[key].checks;
        var checks = {};
        if (src && typeof src === "object") {
          Object.keys(src).forEach(function (id) {
            if (src[id]) checks[id] = true;
          });
        }
        if (Object.keys(checks).length) days[key] = { checks: checks };
      });
      base.days = days;
    } else if (strict && raw.days != null) {
      throw new Error("The backup day log is unreadable.");
    }
    if (Array.isArray(raw.weights)) {
      var weights = [];
      var used = {};
      raw.weights.forEach(function (w) {
        if (!w || !/^\d{4}-\d{2}-\d{2}$/.test(String(w.date))) return;
        var lbs = Number(w.lbs);
        if (!Number.isFinite(lbs) || lbs < 80 || lbs > 600 || used[w.date]) return;
        used[w.date] = true;
        weights.push({ date: w.date, lbs: round1(lbs) });
      });
      weights.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      base.weights = weights;
    }
    base.startWeight = round1(clampNum(raw.startWeight, 80, 600, 302));
    base.goalWeight = round1(clampNum(raw.goalWeight, 80, 600, 275));
    base.pocGoal = Math.round(clampNum(raw.pocGoal, 1, 100000, 500));
    base.pocBaseline = Math.round(clampNum(raw.pocBaseline, 0, 100000, 0));
    if (typeof raw.startedOn === "string" && /^\d{4}-\d{2}-\d{2}$/.test(raw.startedOn)) {
      base.startedOn = raw.startedOn;
    }
    base.version = 1;
    return base;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (err) {
      showToast("Could not save on this phone.");
    }
  }

  function checksFor(date) {
    return (state.days[date] && state.days[date].checks) || {};
  }

  function isItemOn(date, id) {
    return !!checksFor(date)[id];
  }

  function totalItems() {
    return state.items.length;
  }

  function score(date) {
    var checks = checksFor(date);
    var n = 0;
    state.items.forEach(function (item) {
      if (checks[item.id]) n += 1;
    });
    return n;
  }

  function isComplete(date) {
    var total = totalItems();
    return total > 0 && score(date) === total;
  }

  function currentStreak() {
    var cursor = todayKey();
    if (!isComplete(cursor)) cursor = addDays(cursor, -1);
    var n = 0;
    while (n < 5000 && isComplete(cursor)) {
      n += 1;
      cursor = addDays(cursor, -1);
    }
    return n;
  }

  function bestStreak() {
    var keys = Object.keys(state.days).filter(isComplete).sort();
    var best = 0;
    var run = 0;
    var prev = "";
    keys.forEach(function (key) {
      run = prev && addDays(prev, 1) === key ? run + 1 : 1;
      if (run > best) best = run;
      prev = key;
    });
    return best;
  }

  function itemCurrentStreak(id) {
    var cursor = todayKey();
    if (!isItemOn(cursor, id)) cursor = addDays(cursor, -1);
    var n = 0;
    while (n < 5000 && isItemOn(cursor, id)) {
      n += 1;
      cursor = addDays(cursor, -1);
    }
    return n;
  }

  function itemBestStreak(id) {
    var keys = Object.keys(state.days).filter(function (key) { return isItemOn(key, id); }).sort();
    var best = 0;
    var run = 0;
    var prev = "";
    keys.forEach(function (key) {
      run = prev && addDays(prev, 1) === key ? run + 1 : 1;
      if (run > best) best = run;
      prev = key;
    });
    return best;
  }

  function totalPocs() {
    var n = Number(state.pocBaseline) || 0;
    var pocItems = state.items.filter(function (item) { return item.pocs > 0; });
    Object.keys(state.days).forEach(function (date) {
      var checks = state.days[date].checks || {};
      pocItems.forEach(function (item) {
        if (checks[item.id]) n += item.pocs;
      });
    });
    return n;
  }

  function weightOn(date) {
    for (var i = 0; i < state.weights.length; i += 1) {
      if (state.weights[i].date === date) return state.weights[i];
    }
    return null;
  }

  function latestWeight() {
    if (!state.weights.length) return Number(state.startWeight);
    return Number(state.weights[state.weights.length - 1].lbs);
  }

  function poundsToGo() {
    return round1(latestWeight() - Number(state.goalWeight));
  }

  function chartSeries() {
    if (!state.weights.length) {
      return [{ date: state.startedOn, lbs: Number(state.startWeight), start: true }];
    }
    return state.weights.map(function (w) { return { date: w.date, lbs: Number(w.lbs) }; });
  }

  function activeDate() {
    return addDays(todayKey(), ui.dayOffset);
  }

  function showToast(text) {
    var el = document.getElementById("toast");
    el.textContent = text;
    el.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(function () { el.hidden = true; }, 2200);
  }

  function ringSvg(sc, total) {
    var r = 46;
    var circ = 2 * Math.PI * r;
    var off = total === 0 ? circ : circ * (1 - sc / total);
    var perfect = total > 0 && sc === total;
    return ''
      + '<div class="ring-wrap' + (perfect ? " is-perfect" : "") + '" data-score="' + sc + "/" + total + '">'
      + (ui.celebrate ? '<span class="burst" aria-hidden="true"></span>' : "")
      + '<svg viewBox="0 0 120 120" aria-hidden="true">'
      + '<defs><linearGradient id="ringGrad" x1="0" y1="1" x2="1" y2="0">'
      + '<stop offset="0" stop-color="#ff5a1f"/><stop offset="0.55" stop-color="#f0c14b"/><stop offset="1" stop-color="#ffe7a8"/>'
      + '</linearGradient></defs>'
      + '<circle class="ring-track" cx="60" cy="60" r="' + r + '"/>'
      + (sc > 0
        ? '<circle class="ring-fg" cx="60" cy="60" r="' + r + '" stroke="url(#ringGrad)" stroke-dasharray="' + circ.toFixed(2) + '" data-off="' + off.toFixed(2) + '" transform="rotate(-90 60 60)"/>'
        : "")
      + "</svg>"
      + '<div class="ring-label"><strong>' + sc + "</strong><span>/" + total + "</span></div>"
      + "</div>";
  }

  function itemButton(item, date) {

  function drawChart() {
    var canvas = document.getElementById("chart");
    if (!canvas) return;
    var cssW = canvas.clientWidth;
    var cssH = canvas.clientHeight;
    if (cssW < 20 || cssH < 20) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    var points = chartSeries();
    var goal = Number(state.goalWeight);
    var pad = { l: 42, r: 14, t: 18, b: 28 };
    var plotW = cssW - pad.l - pad.r;
    var plotH = cssH - pad.t - pad.b;
    var vals = points.map(function (p) { return p.lbs; }).concat([goal]);
    var min = Math.min.apply(null, vals) - 4;
    var max = Math.max.apply(null, vals) + 4;
    if (max - min < 12) {
      var mid = (max + min) / 2;
      min = mid - 6;
      max = mid + 6;
    }
    function yOf(v) { return pad.t + ((max - v) / (max - min)) * plotH; }
    function xOf(i) {
      if (points.length === 1) return pad.l + 18;
      return pad.l + (i / (points.length - 1)) * plotW;
    }
    ctx.font = "11px Inter, sans-serif";
    ctx.textBaseline = "middle";
    ctx.lineWidth = 1;
    for (var t = 0; t <= 4; t += 1) {
      var value = min + (max - min) * (t / 4);
      var y = yOf(value);
      ctx.strokeStyle = "rgba(240,193,75,0.12)";
      ctx.beginPath();
      ctx.moveTo(pad.l, y);
      ctx.lineTo(cssW - pad.r, y);
      ctx.stroke();
      ctx.fillStyle = "#8a8172";
      ctx.textAlign = "left";
      ctx.fillText(String(Math.round(value)), 6, y);
    }
    var gy = yOf(goal);
    ctx.save();
    ctx.strokeStyle = "#ff5a1f";
    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pad.l, gy);
    ctx.lineTo(cssW - pad.r, gy);
    ctx.stroke();
    ctx.restore();
    var goalLabel = "GOAL " + formatLbs(goal);
    ctx.fillStyle = "#ff5a1f";
    ctx.textAlign = "right";
    var labelY = gy - 10;
    if (labelY < pad.t + 8) labelY = gy + 12;
    ctx.fillText(goalLabel, cssW - pad.r, labelY);

    ctx.beginPath();
    points.forEach(function (p, i) {
      var x = xOf(i);
      var y = yOf(p.lbs);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.lineTo(xOf(points.length - 1), pad.t + plotH);
    ctx.lineTo(xOf(0), pad.t + plotH);
    ctx.closePath();
    var grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + plotH);
    grad.addColorStop(0, "rgba(240,193,75,0.32)");
    grad.addColorStop(1, "rgba(240,193,75,0.02)");
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.strokeStyle = "#f0c14b";
    ctx.lineWidth = 2.6;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    points.forEach(function (p, i) {
      var x = xOf(i);
      var y = yOf(p.lbs);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.shadowColor = "rgba(240,193,75,0.55)";
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;

    points.forEach(function (p, i) {
      var x = xOf(i);
      var y = yOf(p.lbs);
      ctx.beginPath();
      ctx.fillStyle = "#1a140c";
      ctx.strokeStyle = "#ffe7a8";
      ctx.lineWidth = 2;
      ctx.arc(x, y, i === points.length - 1 ? 5.5 : 4.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      if (p.start) {
        ctx.fillStyle = "#b7ad9c";
        ctx.textAlign = "left";
        ctx.fillText("START", x + 8, y - 10);
      }
    });

    ctx.fillStyle = "#8a8172";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    var labelIdx = points.length <= 3
      ? points.map(function (_, i) { return i; })
      : [0, Math.floor((points.length - 1) / 2), points.length - 1];
    labelIdx.forEach(function (i) {
      var x = xOf(i);
      ctx.fillText(shortDate(points[i].date), Math.max(pad.l + 16, Math.min(cssW - pad.r - 16, x)), cssH - 8);
    });
  }

    if (keep) window.scrollTo(0, y);
    else window.scrollTo(0, 0);

  }

  function toggleItem(date, id) {
    if (!state.items.some(function (item) { return item.id === id; })) return;
    if (date > todayKey()) return;
    var before = score(date);
    var checks = Object.assign({}, checksFor(date));
    if (checks[id]) delete checks[id];
    else checks[id] = true;
    if (Object.keys(checks).length === 0) delete state.days[date];
    else state.days[date] = { checks: checks };
    var after = score(date);
    var total = totalItems();
    ui.justKey = date + ":" + id;
    ui.celebrate = before < total && after === total;
    if (ui.celebrate) showToast("Full day. Prizefighter Day.");
    if (navigator.vibrate) navigator.vibrate(12);
    save();
    render({ keepScroll: true });
  }

  function saveWeight(date, lbs) {
    state.weights = state.weights.filter(function (w) { return w.date !== date; });
    state.weights.push({ date: date, lbs: lbs });
    state.weights.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    save();
  }

  function readWeight(form) {
    var data = new FormData(form);
    var date = String(data.get("date") || "");
    var lbs = Number(data.get("lbs"));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return { error: "Pick a date." };
    if (date > todayKey()) return { error: "That day has not happened yet." };
    if (!Number.isFinite(lbs) || lbs < 80 || lbs > 600) return { error: "Enter a weight between 80 and 600." };
    return { date: date, lbs: round1(lbs) };
  }

  function moveItem(id, dir) {
    var item = state.items.filter(function (it) { return it.id === id; })[0];
    if (!item) return;
    var siblings = state.items.filter(function (it) { return it.group === item.group; });
    var index = siblings.findIndex(function (it) { return it.id === id; });
    var next = index + dir;
    if (next < 0 || next >= siblings.length) return;
    var other = siblings[next];
    var ia = state.items.indexOf(item);
    var ib = state.items.indexOf(other);
    state.items[ia] = other;
    state.items[ib] = item;
    save();
    render({ keepScroll: true });
  }

  document.body.addEventListener("click", function (event) {
    var target = event.target.closest("[data-action]");
    if (!target) return;
    var action = target.dataset.action;
    if (action === "stop") return;
    if (action === "nav") {
      go(target.dataset.view);
      return;
    }
    if (action === "day") {
      ui.dayOffset = Number(target.dataset.offset);
      render();
      return;
    }
    if (action === "toggle") {
      toggleItem(target.dataset.date, target.dataset.id);
      return;
    }
    if (action === "iam") {
      ui.iamOpen = !ui.iamOpen;
      render({ keepScroll: true });
      return;
    }
    if (action === "month") {
      if (target.disabled) return;
      var dir = Number(target.dataset.dir);
      var next = new Date(ui.month.getFullYear(), ui.month.getMonth() + dir, 1);
      var max = new Date().getFullYear() * 12 + new Date().getMonth();
      var candidate = next.getFullYear() * 12 + next.getMonth();
      if (candidate > max || candidate < 2020 * 12) return;
      ui.month = next;
      render({ keepScroll: true });
      return;
    }
    if (action === "open-day") {
      if (target.dataset.date > todayKey()) return;
      ui.sheetDate = target.dataset.date;
      render({ keepScroll: true });
      return;
    }
    if (action === "close-sheet") {
      ui.sheetDate = null;
      render({ keepScroll: true });
      return;
    }
    if (action === "export") {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = "my-prize-fighter-day-" + todayKey() + ".json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      showToast("Backup saved.");
      return;
    }
    if (action === "add-item") {
      if (state.items.length >= 24) {
        showToast("24 items is the limit.");
        return;
      }
      state.items.push({ id: uid(), group: "PERSONAL", label: "New standard" });
      save();
      render({ keepScroll: true });
      return;
    }
    if (action === "delete-item") {
      if (state.items.length <= 1) {
        showToast("Keep at least one standard.");
        return;
      }
      if (!confirm("Remove this item?")) return;
      state.items = state.items.filter(function (item) { return item.id !== target.dataset.id; });
      save();
      render({ keepScroll: true });
      return;
    }
    if (action === "move") {
      moveItem(target.dataset.id, Number(target.dataset.dir));
      return;
    }
    if (action === "delete-weight") {
      state.weights = state.weights.filter(function (w) { return w.date !== target.dataset.date; });
      save();
      showToast("Weigh-in removed.");
      render({ keepScroll: true });
      return;
    }
    if (action === "reset") {
      if (!confirm("Erase every day, streak, and weigh-in on this phone?")) return;
      state = fresh();
      ui.dayOffset = 0;
      ui.sheetDate = null;
      ui.ringFrom = null;
      save();
      showToast("Started clean.");
      render();
      return;
    }
    if (action === "install" && deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null;
        ui.canInstall = false;
        render({ keepScroll: true });
      });
    }
  });

  document.body.addEventListener("submit", function (event) {
    var form = event.target.closest("form[data-action='weight-form']");
    if (!form) return;
    event.preventDefault();
    var result = readWeight(form);
    var hint = form.querySelector("[data-weight-error]");
    if (result.error) {
      if (hint) hint.textContent = result.error;
      return;
    }
    saveWeight(result.date, result.lbs);
    showToast("Weight logged.");
    render({ keepScroll: true });
  });

  document.body.addEventListener("input", function (event) {
    var input = event.target.closest("[data-item-label]");
    if (!input) return;
    var item = state.items.filter(function (it) { return it.id === input.dataset.itemLabel; })[0];
    if (!item) return;
    item.label = input.value.slice(0, 80);
    save();
  });

  document.body.addEventListener("change", function (event) {
    var target = event.target;
    if (target.id === "import-file") {
      var file = target.files && target.files[0];
      target.value = "";
      if (!file) return;
      file.text().then(function (text) {
        var parsed;
        try {
          parsed = JSON.parse(text);
        } catch (parseErr) {
          throw new Error("That file is not valid JSON.");
        }
        var next = normalize(parsed, true);
        if (!confirm("Replace all data on this phone with this backup?")) return;
        state = next;
        ui.importError = "";
        ui.ringFrom = null;
        save();
        showToast("Backup imported.");
        render();
      }).catch(function (err) {
        ui.importError = err && err.message ? err.message : "Could not read that file.";
        render({ keepScroll: true });
      });
      return;
    }
    var group = target.closest("[data-item-group]");
    if (group) {
      var item = state.items.filter(function (it) { return it.id === group.dataset.itemGroup; })[0];
      if (!item || GROUPS.indexOf(group.value) === -1) return;
      item.group = group.value;
      state.items = state.items.filter(function (it) { return it.id !== item.id; }).concat(item);
      save();
      render({ keepScroll: true });
      return;
    }
    var pocs = target.closest("[data-item-pocs]");
    if (pocs) {
      var pocItem = state.items.filter(function (it) { return it.id === pocs.dataset.itemPocs; })[0];
      if (!pocItem) return;
      var n = Math.round(Number(pocs.value));
      if (!Number.isFinite(n) || n <= 0) delete pocItem.pocs;
      else pocItem.pocs = Math.min(99, n);
      save();
      render({ keepScroll: true });
      return;
    }
    var setting = target.closest("[data-setting]");
    if (setting) {
      var key = setting.dataset.setting;
      if (key === "startWeight" || key === "goalWeight") state[key] = round1(clampNum(setting.value, 80, 600, state[key]));
      if (key === "pocGoal") state.pocGoal = Math.round(clampNum(setting.value, 1, 100000, state.pocGoal));
      if (key === "pocBaseline") state.pocBaseline = Math.round(clampNum(setting.value, 0, 100000, state.pocBaseline));
      save();
      showToast("Saved.");
      render({ keepScroll: true });
    }
  });

  document.body.addEventListener("focusout", function (event) {
    var input = event.target.closest("[data-item-label]");
    if (!input) return;
    var item = state.items.filter(function (it) { return it.id === input.dataset.itemLabel; })[0];
    if (!item) return;
    if (!item.label.trim()) {
      item.label = "Untitled";
      save();
      render({ keepScroll: true });
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && ui.sheetDate) {
      ui.sheetDate = null;
      render({ keepScroll: true });
    }
  });

  window.addEventListener("hashchange", function () {
    var view = (location.hash || "#today").replace("#", "");
    ui.view = views[view] ? view : "today";
    ui.sheetDate = null;
    render();
  });

  window.addEventListener("resize", function () {
    if (ui.view === "weight") drawChart();
  });

  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    deferredPrompt = event;
    ui.canInstall = true;
    if (ui.view === "settings") render({ keepScroll: true });
  });

  function boot() {
    try {
      var raw = localStorage.getItem(KEY);
      state = raw ? normalize(JSON.parse(raw)) : fresh();
    } catch (err) {
      state = fresh();
      setTimeout(function () { showToast("Saved data could not be read. Started clean."); }, 0);
    }
    save();
    if (!location.hash) history.replaceState(null, "", "#today");
    var view = (location.hash || "#today").replace("#", "");
    ui.view = views[view] ? view : "today";
    ui.month = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    render();
  }

  boot();
})();
</script>
</body>
</html>
