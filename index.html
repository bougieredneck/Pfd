  .item-label { flex: 1; font-size: 1.05rem; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }

  <noscript><p class="noscript">Turn JavaScript on. This page runs on your phone and does not use a server.</p></noscript>
<script>
(function () {
  var KEY = "prizefighter-day-v1";
  var SYNC_URL_RE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/(exec|dev)\/?(\?.*)?$/;
  var GROUPS = ["PERSONAL", "PROFESSIONAL", "SERVICE", "DISCIPLINE"];
  var WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DEFAULT_ITEMS = [
    { id: "prayer", group: "PERSONAL", label: "Daily prayer" },
    { id: "nutrition", group: "PERSONAL", label: "-1 nutrition (one thing off my plate)" },
    { id: "body", group: "PERSONAL", label: "Moved my body" },
    { id: "journal", group: "PERSONAL", label: "Journaled \"I am 275\"" },
    { id: "pocs", group: "PROFESSIONAL", label: "2 POCs", pocs: 2 },
    { id: "touch", group: "PROFESSIONAL", label: "Unexpected intentional touch" },
    { id: "team", group: "PROFESSIONAL", label: "Team did 1" },
    { id: "kindness", group: "SERVICE", label: "Random act of kindness" },
    { id: "ben", group: "DISCIPLINE", label: "Daily text to Ben" },
    { id: "heu", group: "DISCIPLINE", label: "High Energy Units" }
  ];

  var state;
  var deferredPrompt = null;
  var ui = {
    view: "today",
    dayOffset: 0,
    month: null,
    sheetDate: null,
    justKey: "",
    iamOpen: false,
    canInstall: false,
    importError: "",
    ringFrom: null,
    celebrate: false,
    focusGoal: ""
  };
  var syncQueue = {};
  var syncTimer = 0;

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function uid() {
    return "i" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
  }

  function dateKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function parseKey(key) {
    var parts = key.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function addDays(key, n) {
    var d = parseKey(key);
    d.setDate(d.getDate() + n);
    return dateKey(d);
  }

  function todayKey() {
    return dateKey(new Date());
  }

  function pretty(key) {
    var d = parseKey(key);
    return WEEKDAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
  }

  function shortDate(key) {
    var d = parseKey(key);
    return MONTHS[d.getMonth()] + " " + d.getDate();
  }

  function isFriday(key) {
    return parseKey(key).getDay() === 5;
  }

  function round1(n) {
    return Math.round(Number(n) * 10) / 10;
  }

  function formatLbs(n) {
    var r = round1(n);
    return Number.isInteger(r) ? String(r) : r.toFixed(1);
  }

  function clampNum(value, min, max, fallback) {
    var n = Number(value);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function clip(value, max) {
    return String(value == null ? "" : value).replace(/\r\n/g, "\n").slice(0, max);
  }

  function cleanText(value, max) {
    return clip(value, max).trim();
  }

  function fresh() {
    return {
      version: 1,
      items: DEFAULT_ITEMS.map(function (item) { return Object.assign({}, item); }),
      days: {},
      weights: [],
      startWeight: 302,
      goalWeight: 275,
      pocGoal: 500,
      pocBaseline: 0,
      startedOn: todayKey(),
      iAmLine: "I am 275",
      goals: [],
      myBurn: "",
      syncUrl: ""
    };
  }

  function goalsFrom(list, strict) {
    var goals = [];
    var seen = {};
    list.forEach(function (g) {
      var text = "";
      var id = "";
      if (typeof g === "string") text = g;
      else if (g && typeof g === "object" && typeof g.text === "string") {
        text = g.text;
        id = String(g.id || "");
      } else if (g == null || g === "") return;
      else if (strict) throw new Error("A goal is unreadable.");
      else return;
      text = cleanText(text, 160);
      if (!text) return;
      if (!id || seen[id]) id = uid();
      seen[id] = true;
      goals.push({ id: id, text: text });
    });
    return goals.slice(0, 24);
  }

  function dayFrom(src, items, strict) {
    if (!src || typeof src !== "object" || Array.isArray(src)) {
      if (strict) throw new Error("A day in the backup is unreadable.");
      return null;
    }
    var day = {};
    if (src.checks && typeof src.checks === "object") {
      var checks = checksById(src.checks, items);
      if (Object.keys(checks).length) day.checks = checks;
    }
    if (src.prayed === true) day.prayed = true;
    var oneMore = cleanText(src.oneMore, 240);
    if (oneMore) day.oneMore = oneMore;
    var whoTask = cleanText(src.whoTask, 240);
    if (whoTask) day.whoTask = whoTask;
    var whoName = cleanText(src.whoName, 80);
    if (whoName) day.whoName = whoName;
    var winsIn = Array.isArray(src.wins) ? src.wins : [];
    var wins = ["", "", ""];
    var anyWin = false;
    for (var i = 0; i < 3; i += 1) {
      wins[i] = cleanText(winsIn[i], 240);
      if (wins[i]) anyWin = true;
    }
    if (anyWin) day.wins = wins;
    if (!Object.keys(day).length) return null;
    return day;
  }

  function normalize(raw, strict) {
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) {
      if (strict) throw new Error("That file is not a Prize Fighter backup.");
      return fresh();
    }
    var base = fresh();
    if (!Array.isArray(raw.items) || !raw.items.length) {
      if (strict) throw new Error("The backup has no habit items.");
    } else {
      var items = [];
      var seen = {};
      raw.items.forEach(function (item) {
        if (!item || typeof item.label !== "string" || !item.label.trim()) {
          if (strict) throw new Error("An item is missing a name.");
          return;
        }
        if (GROUPS.indexOf(item.group) === -1) {
          if (strict) throw new Error("An item has an unknown group.");
          return;
        }
        var id = String(item.id || "");
        if (!id || seen[id]) id = uid();
        seen[id] = true;
        var next = { id: id, group: item.group, label: item.label.trim().slice(0, 80) };
        var pocs = Math.round(Number(item.pocs));
        if (pocs > 0) next.pocs = Math.min(99, pocs);
        items.push(next);
      });
      if (!items.length) {
        if (strict) throw new Error("The backup has no habit items.");
      } else {
        base.items = items.slice(0, 24);
      }
    }
    if (raw.days && typeof raw.days === "object" && !Array.isArray(raw.days)) {
      var days = {};
      Object.keys(raw.days).forEach(function (key) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) return;
        var day = dayFrom(raw.days[key], base.items, strict);
        if (day) days[key] = day;
      });
      base.days = days;
    } else if (strict && raw.days != null) {
      throw new Error("The backup day log is unreadable.");
    }
    if (Array.isArray(raw.weights)) {
      var weights = [];
      var used = {};
      raw.weights.forEach(function (w) {
        if (!w || !/^\d{4}-\d{2}-\d{2}$/.test(String(w.date))) return;
        var lbs = Number(w.lbs);
        if (!Number.isFinite(lbs) || lbs < 80 || lbs > 600 || used[w.date]) return;
        used[w.date] = true;
        weights.push({ date: w.date, lbs: round1(lbs) });
      });
      weights.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      base.weights = weights;
    }
    base.startWeight = round1(clampNum(raw.startWeight, 80, 600, 302));
    base.goalWeight = round1(clampNum(raw.goalWeight, 80, 600, 275));
    base.pocGoal = Math.round(clampNum(raw.pocGoal, 1, 100000, 500));
    base.pocBaseline = Math.round(clampNum(raw.pocBaseline, 0, 100000, 0));
    if (typeof raw.startedOn === "string" && /^\d{4}-\d{2}-\d{2}$/.test(raw.startedOn)) {
      base.startedOn = raw.startedOn;
    }
    if (typeof raw.iAmLine === "string") base.iAmLine = cleanText(raw.iAmLine, 160);
    if (Array.isArray(raw.goals)) base.goals = goalsFrom(raw.goals, strict);
    else if (raw.goals != null && strict) throw new Error("The backup goals are unreadable.");
    if (typeof raw.myBurn === "string") base.myBurn = cleanText(raw.myBurn, 600);
    if (typeof raw.syncUrl === "string") base.syncUrl = raw.syncUrl.trim().slice(0, 300);
    base.version = 1;
    return base;
  }

  function save(syncDate) {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (err) {
      showToast("Could not save on this phone.");
      return false;
    }
    if (syncDate && canSync()) queueSync(syncDate);
    return true;
  }

  function canSync() {
    return !!(state && SYNC_URL_RE.test(String(state.syncUrl || "").trim()));
  }

  function queueSync(date) {
    syncQueue[date] = true;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(flushSync, 1000);
  }

  function flushSync() {
    var dates = Object.keys(syncQueue);
    syncQueue = {};
    syncTimer = 0;
    if (!dates.length || !canSync()) return;
    postRows(dates.map(dayRow)).catch(function () {});
  }

  function postRows(rows) {
    return fetch(String(state.syncUrl).trim(), {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ days: rows })
    });
  }

  function allSyncDates() {
    var set = {};
    Object.keys(state.days).forEach(function (d) { set[d] = true; });
    state.weights.forEach(function (w) {
      if (w && /^\d{4}-\d{2}-\d{2}$/.test(String(w.date))) set[w.date] = true;
    });
    var dates = Object.keys(set).sort();
    if (!dates.length) dates.push(todayKey());
    return dates;
  }

  function syncNow() {
    commitOpenFields();
    clearTimeout(syncTimer);
    syncQueue = {};
    syncTimer = 0;
    if (!canSync()) {
      showToast(String(state.syncUrl || "").trim() ? "That link is not an Apps Script web app." : "Add your sheet link first.");
      return;
    }
    var dates = allSyncDates();
    postRows(dates.map(dayRow)).then(function () {
      showToast("Sent " + dates.length + (dates.length === 1 ? " day." : " days."));
    }).catch(function () {
      showToast("Could not send. Check the link.");
    });
  }

  function checksById(src, items) {
    var idSet = {};
    var labelToId = {};
    items.forEach(function (item) {
      idSet[item.id] = true;
      if (Object.prototype.hasOwnProperty.call(labelToId, item.label)) labelToId[item.label] = "";
      else labelToId[item.label] = item.id;
    });
    var checks = {};
    Object.keys(src).forEach(function (key) {
      if (!src[key]) return;
      if (idSet[key]) {
        checks[key] = true;
        return;
      }
      var mapped = labelToId[key];
      if (mapped) checks[mapped] = true;
      else checks[key] = true;
    });
    return checks;
  }

  function isStandalone() {
    return window.navigator.standalone === true
      || window.matchMedia("(display-mode: standalone)").matches
      || window.matchMedia("(display-mode: fullscreen)").matches;
  }

  function homeScreenNote() {
    if (isStandalone()) return "";
    return '<p class="homescreen-note">On iPhone, Safari and the home-screen icon keep separate days. Always open Prize Fighter from the home-screen icon.</p>';
  }

  function findItem(id) {
    return state.items.filter(function (it) { return it.id === id; })[0];
  }

  function labelFromField(input) {
    var next = String(input.value || "").trim().slice(0, 80);
    return next || "Untitled";
  }

  function commitHabitLabels() {
    var changed = false;
    document.querySelectorAll("[data-item-label]").forEach(function (input) {
      var item = findItem(input.getAttribute("data-item-label"));
      if (!item) return;
      var next = labelFromField(input);
      if (item.label === next) return;
      item.label = next;
      changed = true;
    });
    if (changed) save();
    return changed;
  }

  function finishLabelEdit(input) {
    if (!input || !input.getAttribute("data-item-label")) return;
    var item = findItem(input.getAttribute("data-item-label"));
    if (!item) return;
    var before = input.dataset.labelBefore != null ? String(input.dataset.labelBefore) : item.label;
    var next = labelFromField(input);
    if (input.isConnected && input.value !== next) input.value = next;
    var edited = before.trim() !== next || item.label !== next;
    if (!edited) return;
    item.label = next;
    input.dataset.labelBefore = next;
    if (!save()) return;
    showToast("Saved");
    var stillNaming = document.activeElement && document.activeElement.closest && document.activeElement.closest("[data-item-label]");
    if (!input.isConnected && !stillNaming) render({ keepScroll: true });
  }

  function fieldMax(kind) {
    if (kind === "syncUrl") return 300;
    if (kind === "whoName") return 80;
    if (kind === "iAmLine" || kind === "goal") return 160;
    if (kind === "myBurn") return 600;
    return 240;
  }

  function rawField(el) {
    var kind = el.getAttribute("data-field");
    var value = String(el.value || "").replace(/\r\n/g, "\n");
    if (kind === "syncUrl") value = value.trim();
    return value.slice(0, fieldMax(kind));
  }

  function trimmedField(el) {
    return rawField(el).trim();
  }

  function storedField(el) {
    var kind = el.getAttribute("data-field");
    var date = el.getAttribute("data-date");
    var day = (date && state.days[date]) || {};
    if (kind === "oneMore" || kind === "whoTask" || kind === "whoName") return day[kind] || "";
    if (kind === "win") return ((day.wins || [])[Number(el.getAttribute("data-win"))]) || "";
    if (kind === "iAmLine") return state.iAmLine || "";
    if (kind === "myBurn") return state.myBurn || "";
    if (kind === "syncUrl") return state.syncUrl || "";
    if (kind === "goal") {
      var id = el.getAttribute("data-goal");
      var goal = state.goals.filter(function (g) { return g.id === id; })[0];
      return goal ? goal.text : "";
    }
    return "";
  }

  function pruneDay(date) {
    var day = state.days[date];
    if (!day) return;
    if (day.checks && !Object.keys(day.checks).length) delete day.checks;
    if (!day.oneMore) delete day.oneMore;
    if (!day.whoTask) delete day.whoTask;
    if (!day.whoName) delete day.whoName;
    if (day.wins && !day.wins.some(function (w) { return w; })) delete day.wins;
    if (!day.prayed) delete day.prayed;
    if (!Object.keys(day).length) delete state.days[date];
  }

  function putField(el, value) {
    if (!el || value === storedField(el)) return null;
    var kind = el.getAttribute("data-field");
    var date = el.getAttribute("data-date") || "";
    if (kind === "oneMore" || kind === "whoTask" || kind === "whoName") {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
      if (!state.days[date]) {
        if (!value) return null;
        state.days[date] = {};
      }
      if (value) state.days[date][kind] = value;
      else delete state.days[date][kind];
      pruneDay(date);
      return date;
    }
    if (kind === "win") {
      var idx = Number(el.getAttribute("data-win"));
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || idx < 0 || idx > 2) return null;
      var existing = state.days[date];
      var wins = existing && existing.wins ? existing.wins.slice(0, 3) : ["", "", ""];
      while (wins.length < 3) wins.push("");
      wins[idx] = value;
      if (!existing) {
        if (!value) return null;
        state.days[date] = {};
      }
      if (wins.some(function (w) { return w; })) state.days[date].wins = wins;
      else delete state.days[date].wins;
      pruneDay(date);
      return date;
    }
    if (kind === "iAmLine") state.iAmLine = value;
    else if (kind === "myBurn") state.myBurn = value;
    else if (kind === "syncUrl") state.syncUrl = value;
    else if (kind === "goal") {
      var goalId = el.getAttribute("data-goal");
      var match = state.goals.filter(function (g) { return g.id === goalId; })[0];
      if (!match) return null;
      match.text = value;
    } else return null;
    return "";
  }

  function commitOpenFields() {
    if (!state) return false;
    var changed = false;
    var syncDate = "";
    document.querySelectorAll("[data-field]").forEach(function (el) {
      var date = putField(el, trimmedField(el));
      if (date === null) return;
      changed = true;
      if (date) syncDate = date;
    });
    if (!changed) return false;
    save(syncDate || undefined);
    return true;
  }

  function finishField(el) {
    if (!el || !el.getAttribute("data-field")) return;
    var before = el.dataset.fieldBefore != null ? String(el.dataset.fieldBefore) : trimmedField(el);
    var next = trimmedField(el);
    var date = putField(el, next);
    if (el.isConnected && el.value !== next) el.value = next;
    el.dataset.fieldBefore = next;
    if (before === next && date === null) return;
    if (date !== null && !save(date || undefined)) return;
    if (before !== next) showToast("Saved");
  }

  function scheduleFieldFinish(el) {
    if (!el) return;
    setTimeout(function () { finishField(el); }, 120);
  }

  function checksFor(date) {
    return (state.days[date] && state.days[date].checks) || {};
  }

  function isItemOn(date, id) {
    return !!checksFor(date)[id];
  }

  function totalItems() {
    return state.items.length;
  }

  function score(date) {
    var checks = checksFor(date);
    var n = 0;
    state.items.forEach(function (item) {
      if (checks[item.id]) n += 1;
    });
    return n;
  }

  function isComplete(date) {
    var total = totalItems();
    return total > 0 && score(date) === total;
  }

  function currentStreak() {
    var cursor = todayKey();
    if (!isComplete(cursor)) cursor = addDays(cursor, -1);
    var n = 0;
    while (n < 5000 && isComplete(cursor)) {
      n += 1;
      cursor = addDays(cursor, -1);
    }
    return n;
  }

  function bestStreak() {
    var keys = Object.keys(state.days).filter(isComplete).sort();
    var best = 0;
    var run = 0;
    var prev = "";
    keys.forEach(function (key) {
      run = prev && addDays(prev, 1) === key ? run + 1 : 1;
      if (run > best) best = run;
      prev = key;
    });
    return best;
  }

  function itemCurrentStreak(id) {
    var cursor = todayKey();
    if (!isItemOn(cursor, id)) cursor = addDays(cursor, -1);
    var n = 0;
    while (n < 5000 && isItemOn(cursor, id)) {
      n += 1;
      cursor = addDays(cursor, -1);
    }
    return n;
  }

  function itemBestStreak(id) {
    var keys = Object.keys(state.days).filter(function (key) { return isItemOn(key, id); }).sort();
    var best = 0;
    var run = 0;
    var prev = "";
    keys.forEach(function (key) {
      run = prev && addDays(prev, 1) === key ? run + 1 : 1;
      if (run > best) best = run;
      prev = key;
    });
    return best;
  }

  function totalPocs() {
    var n = Number(state.pocBaseline) || 0;
    var pocItems = state.items.filter(function (item) { return item.pocs > 0; });
    Object.keys(state.days).forEach(function (date) {
      var checks = state.days[date].checks || {};
      pocItems.forEach(function (item) {
        if (checks[item.id]) n += item.pocs;
      });
    });
    return n;
  }

  function pocsThrough(date) {
    var n = Number(state.pocBaseline) || 0;
    var pocItems = state.items.filter(function (item) { return item.pocs > 0; });
    Object.keys(state.days).forEach(function (key) {
      if (key > date) return;
      var checks = (state.days[key] && state.days[key].checks) || {};
      pocItems.forEach(function (item) {
        if (checks[item.id]) n += item.pocs;
      });
    });
    return n;
  }

  function dayRow(date) {
    var day = state.days[date] || {};
    var wins = day.wins || ["", "", ""];
    var logged = weightOn(date);
    var checks = checksFor(date);
    return {
      date: date,
      itemsDone: state.items.filter(function (item) { return checks[item.id]; }).map(function (item) { return item.label; }).join(", "),
      score: score(date) + "/" + totalItems(),
      prayed: day.prayed ? "yes" : "no",
      oneMore: day.oneMore || "",
      whoTask: day.whoTask || "",
      who: day.whoName || "",
      win1: wins[0] || "",
      win2: wins[1] || "",
      win3: wins[2] || "",
      weight: logged ? formatLbs(logged.lbs) : "",
      pocCount: pocsThrough(date)
    };
  }

  function weightOn(date) {
    for (var i = 0; i < state.weights.length; i += 1) {
      if (state.weights[i].date === date) return state.weights[i];
    }
    return null;
  }

  function latestWeight() {
    if (!state.weights.length) return Number(state.startWeight);
    return Number(state.weights[state.weights.length - 1].lbs);
  }

  function poundsToGo() {
    return round1(latestWeight() - Number(state.goalWeight));
  }

  function chartSeries() {
    if (!state.weights.length) {
      return [{ date: state.startedOn, lbs: Number(state.startWeight), start: true }];
    }
    return state.weights.map(function (w) { return { date: w.date, lbs: Number(w.lbs) }; });
  }

  function activeDate() {
    return addDays(todayKey(), ui.dayOffset);
  }

  function showToast(text) {
    var el = document.getElementById("toast");
    el.textContent = text;
    el.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(function () { el.hidden = true; }, 2200);
  }

  function ringSvg(sc, total) {
    var r = 46;
    var circ = 2 * Math.PI * r;
    var off = total === 0 ? circ : circ * (1 - sc / total);
    var perfect = total > 0 && sc === total;
    return ''
      + '<div class="ring-wrap' + (perfect ? " is-perfect" : "") + '" data-score="' + sc + "/" + total + '">'
      + (ui.celebrate ? '<span class="burst" aria-hidden="true"></span>' : "")
      + '<svg viewBox="0 0 120 120" aria-hidden="true">'
      + '<defs><linearGradient id="ringGrad" x1="0" y1="1" x2="1" y2="0">'
      + '<stop offset="0" stop-color="#ff5a1f"/><stop offset="0.55" stop-color="#f0c14b"/><stop offset="1" stop-color="#ffe7a8"/>'
      + '</linearGradient></defs>'
      + '<circle class="ring-track" cx="60" cy="60" r="' + r + '"/>'
      + (sc > 0
        ? '<circle class="ring-fg" cx="60" cy="60" r="' + r + '" stroke="url(#ringGrad)" stroke-dasharray="' + circ.toFixed(2) + '" data-off="' + off.toFixed(2) + '" transform="rotate(-90 60 60)"/>'
        : "")
      + "</svg>"
      + '<div class="ring-label"><strong>' + sc + "</strong><span>/" + total + "</span></div>"
      + "</div>";
  }

  function itemButton(item, date) {
    var on = isItemOn(date, item.id);
    var just = ui.justKey === date + ":" + item.id;
    var cls = "item" + (on ? " is-on" : "") + (just ? " just" : "");
    return ''
      + '<button type="button" class="' + cls + '" aria-pressed="' + (on ? "true" : "false") + '" data-action="toggle" data-id="' + esc(item.id) + '" data-date="' + date + '">'
      + '<span class="box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7.5"/></svg></span>'
      + '<span class="item-label">' + esc(item.label) + "</span>"
      + (item.pocs ? '<em class="poc-tag">+' + item.pocs + "</em>" : "")
      + "</button>";
  }

  function checklist(date) {
    return GROUPS.map(function (group) {
      var items = state.items.filter(function (item) { return item.group === group; });
      if (!items.length) return "";
      var done = items.filter(function (item) { return isItemOn(date, item.id); }).length;
      return ''
        + '<section class="group-block">'
        + '<h2 class="group">' + group + "<span>" + done + "/" + items.length + "</span></h2>"

        + "</section>";
    }).join("");
  }

  function pocBlock() {
    var total = totalPocs();
    var goal = state.pocGoal;

    var adder = state.items.filter(function (item) { return item.pocs > 0; })[0];
    var hint = adder
      ? "Checking “" + adder.label + "” adds " + adder.pocs + " toward " + goal + " clients."

    return ''
      + '<section class="poc">'
      + '<div class="poc-top"><h2>POCs</h2><strong data-poc-total>' + total + " / " + goal + "</strong></div>"
      + '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + goal + '" aria-valuenow="' + total + '" aria-label="POCs toward ' + goal + ' clients"><div class="bar-fill" style="width:' + pct.toFixed(2) + '%"></div></div>'
      + '<p class="hint">' + esc(hint) + "</p>"
      + "</section>";
  }

  function fridayCard(date, existing) {
    var value = existing ? formatLbs(existing.lbs) : "";
    return ''

      + '<input type="hidden" name="date" value="' + date + '">'

      + '<button type="submit">' + (existing ? "Update" : "Log it") + "</button>"
      + '<p class="hint error" data-weight-error></p>'
      + "</form>"
      + "</section>";
  }

  function viewToday() {
    var date = activeDate();

      + '<div class="switch" role="group" aria-label="Which day">'

      + '<button type="button" data-action="day" data-offset="-1" aria-pressed="' + (ui.dayOffset === -1 ? "true" : "false") + '">Yesterday</button>'

  function iamCard() {

      + "</section>";

  function viewStreaks() {
    var current = currentStreak();
    var best = bestStreak();

    var rows = state.items.map(function (item) {
      var cur = itemCurrentStreak(item.id);

  function heatClass(sc, total) {
    if (!sc) return "";
    if (sc >= total) return " full";
    var ratio = sc / total;
    if (ratio < 0.4) return " low";
    if (ratio < 0.7) return " mid";
    return " high";
  }

  function viewHistory() {
    var year = ui.month.getFullYear();
    var month = ui.month.getMonth();
    var first = new Date(year, month, 1);
    var pad = first.getDay();
    var daysIn = new Date(year, month + 1, 0).getDate();
    var today = todayKey();
    var total = totalItems();
    var nowMonth = new Date().getFullYear() * 12 + new Date().getMonth();
    var thisMonth = year * 12 + month;
    var cells = [];
    for (var i = 0; i < pad; i += 1) cells.push('<span class="day pad"></span>');
    for (var day = 1; day <= daysIn; day += 1) {
      var key = dateKey(new Date(year, month, day));
      var sc = score(key);
      var future = key > today;
      var label = pretty(key) + (sc ? ", " + sc + " of " + total : ", open");
      cells.push(''
        + '<button type="button" class="day' + heatClass(sc, total) + (key === today ? " is-today" : "") + '" data-action="open-day" data-date="' + key + '" '
        + (future ? "disabled " : "")
        + 'aria-label="' + esc(label) + '">'
        + '<span class="n">' + day + "</span>"
        + (sc ? '<span class="s">' + sc + "</span>" : "")
        + "</button>");
    }
    return ''
      + '<header class="subtop"><p class="brand">History</p></header>'
      + '<div class="month-nav">'
      + '<button type="button" data-action="month" data-dir="-1" aria-label="Previous month">‹</button>'
      + "<h1>" + MONTHS_LONG[month] + " " + year + "</h1>"
      + '<button type="button" data-action="month" data-dir="1" aria-label="Next month"' + (thisMonth >= nowMonth ? " disabled" : "") + ">›</button>"
      + "</div>"
      + '<div class="dow"><span>SU</span><span>MO</span><span>TU</span><span>WE</span><span>TH</span><span>FR</span><span>SA</span></div>'
      + '<div class="cal">' + cells.join("") + "</div>"
      + '<p class="legend"><span><i class="swatch" style="background:#1c1914"></i>Open</span><span><i class="swatch" style="background:#7a4e16"></i>Partial</span><span><i class="swatch" style="background:#f0c14b"></i>Full day</span></p>'
      + '<p class="hint">Tap a day to fill it in or change it.</p>';
  }

  function chartBlock() {
    var start = state.startWeight;
    var goal = state.goalWeight;
    return ''
      + '<canvas id="chart" role="img" aria-label="Line chart of weigh-ins from ' + esc(formatLbs(start)) + " pounds toward a goal of " + esc(formatLbs(goal)) + '"></canvas>'
      + '<p class="chart-key"><span><i></i>Weight</span><span><i class="goal"></i>Goal line</span></p>';
  }

  function viewWeight() {
    var delta = poundsToGo();
    var latest = latestWeight();
    var goal = state.goalWeight;
    var start = state.startWeight;
    var heading = delta > 0 ? "pounds to go" : delta === 0 ? "on the goal" : "pounds under goal";
    var shown = formatLbs(Math.abs(delta));
    var logs = state.weights.slice().reverse().map(function (w) {
      return ''
        + '<li class="log-row"><div><strong>' + esc(formatLbs(w.lbs)) + " lb</strong><div class=\"hint\" style=\"margin:0\">" + esc(pretty(w.date)) + (isFriday(w.date) ? " · Friday" : "") + "</div></div>"
        + '<button type="button" class="icon-btn" data-action="delete-weight" data-date="' + w.date + '" aria-label="Delete weigh-in on ' + esc(pretty(w.date)) + '">✕</button></li>';
    }).join("");
    var lastFriday = (function () {
      var d = new Date();
      var since = (d.getDay() + 2) % 7;
      d.setDate(d.getDate() - since);
      return dateKey(d);
    })();
    return ''
      + '<header class="subtop"><p class="brand">Weigh-in</p></header>'
      + '<h1 class="screen-title">Toward ' + esc(formatLbs(goal)) + "</h1>"
      + '<div class="togo"><strong data-pounds="' + delta + '">' + shown + "</strong><span>" + heading + "</span></div>"
      + '<p class="hint" style="margin-top:0">Start ' + esc(formatLbs(start)) + " · Latest " + esc(formatLbs(latest)) + " · Goal " + esc(formatLbs(goal)) + "</p>"
      + chartBlock()
      + '<form class="weigh-form" data-action="weight-form">'
      + '<label class="field">Date<input type="date" name="date" required max="' + todayKey() + '" value="' + lastFriday + '"></label>'
      + '<label class="field">Pounds<input type="number" name="lbs" inputmode="decimal" step="0.1" placeholder="302" required aria-label="Weight in pounds"></label>'
      + '<button type="submit">Save weigh-in</button>'
      + '<p class="hint error" data-weight-error style="grid-column:1/-1"></p>'
      + "</form>"
      + (logs
        ? '<ul class="logs">' + logs + "</ul>"
        : '<p class="note">No Friday number yet. The line holds the starting weight at ' + esc(formatLbs(start)) + " until you log one.</p>");

      + '<section class="section"><h2>Sheet sync</h2>'

    ];
    return ''
      + '<header class="subtop"><p class="brand">My Prize Fighter Day</p></header>'
      + '<h1 class="screen-title">More</h1>'
      + links.map(function (link) {
        return '<button type="button" class="more-link" data-action="nav" data-view="' + link[0] + '">' + link[1] + '<span aria-hidden="true">›</span></button>';
      }).join("");
  }

  function sheetHtml() {
    var date = ui.sheetDate;
    var sc = score(date);
    var total = totalItems();
    var logged = weightOn(date);
    return ''
      + '<div class="sheet-back" data-action="close-sheet">'
      + '<div class="sheet" data-action="stop" role="dialog" aria-modal="true" aria-label="' + esc(pretty(date)) + '">'
      + '<div class="grab"></div>'
      + '<div class="sheet-top"><div><p class="eyebrow">' + (date === todayKey() ? "Today" : date === addDays(todayKey(), -1) ? "Yesterday" : "Edit day") + "</p>"
      + "<h2>" + esc(pretty(date)) + "</h2></div>"
      + '<div class="sheet-actions"><p class="sheet-score" data-sheet-score>' + sc + "/" + total + '</p>'
      + '<button type="button" class="icon-btn" data-action="close-sheet" aria-label="Close">✕</button></div></div>'
      + (isFriday(date) ? fridayCard(date, logged) : "")
      + checklist(date)
      + "</div></div>";
  }

  var views = {
    today: viewToday,
    morning: viewMorning,
    evening: viewEvening,
    goals: viewGoals,
    more: viewMore,
    streaks: viewStreaks,
    history: viewHistory,
    weight: viewWeight,
    settings: viewSettings
  };

  function animateRing() {
    var fg = document.querySelector(".ring-fg");
    if (!fg) return;
    var target = fg.getAttribute("data-off");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var from = ui.ringFrom == null || reduce ? target : String(ui.ringFrom);
    fg.style.transition = "none";
    fg.style.strokeDashoffset = from;
    fg.getBoundingClientRect();
    if (!reduce) fg.style.transition = "stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)";
    fg.style.strokeDashoffset = target;
    ui.ringFrom = target;
  }

  function drawChart() {
    var canvas = document.getElementById("chart");
    if (!canvas) return;
    var cssW = canvas.clientWidth;
    var cssH = canvas.clientHeight;
    if (cssW < 20 || cssH < 20) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    var points = chartSeries();
    var goal = Number(state.goalWeight);
    var pad = { l: 42, r: 14, t: 18, b: 28 };
    var plotW = cssW - pad.l - pad.r;
    var plotH = cssH - pad.t - pad.b;
    var vals = points.map(function (p) { return p.lbs; }).concat([goal]);
    var min = Math.min.apply(null, vals) - 4;
    var max = Math.max.apply(null, vals) + 4;
    if (max - min < 12) {
      var mid = (max + min) / 2;
      min = mid - 6;
      max = mid + 6;
    }
    function yOf(v) { return pad.t + ((max - v) / (max - min)) * plotH; }
    function xOf(i) {
      if (points.length === 1) return pad.l + 18;
      return pad.l + (i / (points.length - 1)) * plotW;
    }
    ctx.font = "11px Inter, sans-serif";
    ctx.textBaseline = "middle";
    ctx.lineWidth = 1;
    for (var t = 0; t <= 4; t += 1) {
      var value = min + (max - min) * (t / 4);
      var y = yOf(value);
      ctx.strokeStyle = "rgba(240,193,75,0.12)";
      ctx.beginPath();
      ctx.moveTo(pad.l, y);
      ctx.lineTo(cssW - pad.r, y);
      ctx.stroke();
      ctx.fillStyle = "#8a8172";
      ctx.textAlign = "left";
      ctx.fillText(String(Math.round(value)), 6, y);
    }
    var gy = yOf(goal);
    ctx.save();
    ctx.strokeStyle = "#ff5a1f";
    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pad.l, gy);
    ctx.lineTo(cssW - pad.r, gy);
    ctx.stroke();
    ctx.restore();
    var goalLabel = "GOAL " + formatLbs(goal);
    ctx.fillStyle = "#ff5a1f";
    ctx.textAlign = "right";
    var labelY = gy - 10;
    if (labelY < pad.t + 8) labelY = gy + 12;
    ctx.fillText(goalLabel, cssW - pad.r, labelY);

    ctx.beginPath();
    points.forEach(function (p, i) {
      var x = xOf(i);
      var y = yOf(p.lbs);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.lineTo(xOf(points.length - 1), pad.t + plotH);
    ctx.lineTo(xOf(0), pad.t + plotH);
    ctx.closePath();
    var grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + plotH);
    grad.addColorStop(0, "rgba(240,193,75,0.32)");
    grad.addColorStop(1, "rgba(240,193,75,0.02)");
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.strokeStyle = "#f0c14b";
    ctx.lineWidth = 2.6;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    points.forEach(function (p, i) {
      var x = xOf(i);
      var y = yOf(p.lbs);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.shadowColor = "rgba(240,193,75,0.55)";
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;

    points.forEach(function (p, i) {
      var x = xOf(i);
      var y = yOf(p.lbs);
      ctx.beginPath();
      ctx.fillStyle = "#1a140c";
      ctx.strokeStyle = "#ffe7a8";
      ctx.lineWidth = 2;
      ctx.arc(x, y, i === points.length - 1 ? 5.5 : 4.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      if (p.start) {
        ctx.fillStyle = "#b7ad9c";
        ctx.textAlign = "left";
        ctx.fillText("START", x + 8, y - 10);
      }
    });

    ctx.fillStyle = "#8a8172";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    var labelIdx = points.length <= 3
      ? points.map(function (_, i) { return i; })
      : [0, Math.floor((points.length - 1) / 2), points.length - 1];
    labelIdx.forEach(function (i) {
      var x = xOf(i);
      ctx.fillText(shortDate(points[i].date), Math.max(pad.l + 16, Math.min(cssW - pad.r - 16, x)), cssH - 8);
    });
  }

  function render(opts) {
    commitHabitLabels();
    commitOpenFields();
    var keep = opts && opts.keepScroll;
    var y = keep ? window.scrollY : 0;
    var celebrate = ui.celebrate;
    document.getElementById("main").innerHTML = views[ui.view]();
    document.getElementById("sheet").innerHTML = ui.sheetDate ? sheetHtml() : "";
    document.body.classList.toggle("sheet-open", !!ui.sheetDate);
    ui.celebrate = false;
    ui.justKey = "";
    var inMore = ui.view === "streaks" || ui.view === "history" || ui.view === "weight" || ui.view === "settings";
    document.querySelectorAll(".tab").forEach(function (btn) {
      var on = btn.dataset.view === ui.view || (btn.dataset.view === "more" && inMore);
      if (on) btn.setAttribute("aria-current", "page");
      else btn.removeAttribute("aria-current");
    });
    animateRing();
    if (ui.view === "weight" || ui.view === "goals") requestAnimationFrame(function () { requestAnimationFrame(drawChart); });
    if (keep) window.scrollTo(0, y);
    else window.scrollTo(0, 0);
    if (ui.focusGoal) {
      var want = ui.focusGoal;
      ui.focusGoal = "";
      var nodes = document.querySelectorAll("[data-goal]");
      for (var gi = 0; gi < nodes.length; gi += 1) {
        if (nodes[gi].getAttribute("data-goal") === want) {
          nodes[gi].focus();
          break;
        }
      }
    }
    if (celebrate) ui.celebrate = false;
  }

  function go(view) {
    if (view !== "today") ui.dayOffset = 0;
    ui.sheetDate = null;
    ui.importError = "";
    var next = "#" + view;
    if (location.hash !== next) location.hash = next;
    else {
      ui.view = view;
      render();
    }
  }

  function toggleItem(date, id) {
    if (!state.items.some(function (item) { return item.id === id; })) return;
    if (date > todayKey()) return;
    var before = score(date);
    var day = state.days[date] || (state.days[date] = {});
    var checks = Object.assign({}, day.checks || {});
    if (checks[id]) delete checks[id];
    else checks[id] = true;
    if (Object.keys(checks).length) day.checks = checks;
    else delete day.checks;
    pruneDay(date);
    var after = score(date);
    var total = totalItems();
    ui.justKey = date + ":" + id;
    ui.celebrate = before < total && after === total;
    if (ui.celebrate) showToast("Full day. Prizefighter Day.");
    if (navigator.vibrate) navigator.vibrate(12);
    save(date);
    render({ keepScroll: true });
  }

  function saveWeight(date, lbs) {
    state.weights = state.weights.filter(function (w) { return w.date !== date; });
    state.weights.push({ date: date, lbs: lbs });
    state.weights.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    save(date);
  }

  function readWeight(form) {
    var data = new FormData(form);
    var date = String(data.get("date") || "");
    var lbs = Number(data.get("lbs"));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return { error: "Pick a date." };
    if (date > todayKey()) return { error: "That day has not happened yet." };
    if (!Number.isFinite(lbs) || lbs < 80 || lbs > 600) return { error: "Enter a weight between 80 and 600." };
    return { date: date, lbs: round1(lbs) };
  }

  function moveItem(id, dir) {
    var item = state.items.filter(function (it) { return it.id === id; })[0];
    if (!item) return;
    var siblings = state.items.filter(function (it) { return it.group === item.group; });
    var index = siblings.findIndex(function (it) { return it.id === id; });
    var next = index + dir;
    if (next < 0 || next >= siblings.length) return;
    var other = siblings[next];
    var ia = state.items.indexOf(item);
    var ib = state.items.indexOf(other);
    state.items[ia] = other;
    state.items[ib] = item;
    save();
    render({ keepScroll: true });
  }

  document.body.addEventListener("click", function (event) {
    var target = event.target.closest("[data-action]");
    if (!target) return;
    var action = target.dataset.action;
    if (action === "stop") return;
    if (action === "nav") {
      go(target.dataset.view);
      return;
    }
    if (action === "day") {
      ui.dayOffset = Number(target.dataset.offset);
      render();
      return;
    }
    if (action === "toggle") {
      toggleItem(target.dataset.date, target.dataset.id);
      return;
    }
    if (action === "iam") {
      ui.iamOpen = !ui.iamOpen;
      render({ keepScroll: true });
      return;
    }
    if (action === "prayed") {
      var prayedDate = todayKey();
      var prayedDay = state.days[prayedDate] || (state.days[prayedDate] = {});
      if (prayedDay.prayed) delete prayedDay.prayed;
      else prayedDay.prayed = true;
      pruneDay(prayedDate);
      save(prayedDate);
      render({ keepScroll: true });
      return;
    }
    if (action === "add-goal") {
      if (state.goals.length >= 24) {
        showToast("24 goals is the limit.");
        return;
      }
      var goalId = uid();
      state.goals.push({ id: goalId, text: "" });
      ui.focusGoal = goalId;
      save();
      render({ keepScroll: true });
      return;
    }
    if (action === "delete-goal") {
      if (!confirm("Remove this goal?")) return;
      state.goals = state.goals.filter(function (g) { return g.id !== target.dataset.id; });
      save();
      render({ keepScroll: true });
      return;
    }
    if (action === "sync-now") {
      syncNow();
      return;
    }
    if (action === "month") {
      if (target.disabled) return;
      var dir = Number(target.dataset.dir);
      var next = new Date(ui.month.getFullYear(), ui.month.getMonth() + dir, 1);
      var max = new Date().getFullYear() * 12 + new Date().getMonth();
      var candidate = next.getFullYear() * 12 + next.getMonth();
      if (candidate > max || candidate < 2020 * 12) return;
      ui.month = next;
      render({ keepScroll: true });
      return;
    }
    if (action === "open-day") {
      if (target.dataset.date > todayKey()) return;
      ui.sheetDate = target.dataset.date;
      render({ keepScroll: true });
      return;
    }
    if (action === "close-sheet") {
      ui.sheetDate = null;
      render({ keepScroll: true });
      return;
    }
    if (action === "export") {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = "my-prize-fighter-day-" + todayKey() + ".json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      showToast("Backup saved.");
      return;
    }
    if (action === "add-item") {
      if (state.items.length >= 24) {
        showToast("24 items is the limit.");
        return;
      }
      state.items.push({ id: uid(), group: "PERSONAL", label: "New standard" });
      save();
      render({ keepScroll: true });
      return;
    }
    if (action === "delete-item") {
      if (state.items.length <= 1) {
        showToast("Keep at least one standard.");
        return;
      }
      if (!confirm("Remove this item?")) return;
      state.items = state.items.filter(function (item) { return item.id !== target.dataset.id; });
      save();
      render({ keepScroll: true });
      return;
    }
    if (action === "move") {
      moveItem(target.dataset.id, Number(target.dataset.dir));
      return;
    }
    if (action === "delete-weight") {
      var removedDate = target.dataset.date;
      state.weights = state.weights.filter(function (w) { return w.date !== removedDate; });
      save(removedDate);
      showToast("Weigh-in removed.");
      render({ keepScroll: true });
      return;
    }
    if (action === "reset") {
      if (!confirm("Erase every day, streak, and weigh-in on this phone?")) return;
      state = fresh();
      ui.dayOffset = 0;
      ui.sheetDate = null;
      ui.ringFrom = null;
      save();
      showToast("Started clean.");
      render();
      return;
    }
    if (action === "install" && deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null;
        ui.canInstall = false;
        render({ keepScroll: true });
      });
    }
  });

  document.body.addEventListener("submit", function (event) {
    var form = event.target.closest("form[data-action='weight-form']");
    if (!form) return;
    event.preventDefault();
    var result = readWeight(form);
    var hint = form.querySelector("[data-weight-error]");
    if (result.error) {
      if (hint) hint.textContent = result.error;
      return;
    }
    saveWeight(result.date, result.lbs);
    showToast("Weight logged.");
    render({ keepScroll: true });
  });

  document.body.addEventListener("focusin", function (event) {
    var input = event.target.closest("[data-item-label]");
    if (input && input.dataset.labelBefore == null) input.dataset.labelBefore = input.value;
    var field = event.target.closest("[data-field]");
    if (field) field.dataset.fieldBefore = trimmedField(field);
  });

  document.body.addEventListener("input", function (event) {
    var field = event.target.closest("[data-field]");
    if (field) {
      var wrote = putField(field, rawField(field));
      if (wrote !== null) save(wrote || undefined);
      return;
    }
    var input = event.target.closest("[data-item-label]");
    if (!input) return;
    var item = findItem(input.getAttribute("data-item-label"));
    if (!item) return;
    if (input.dataset.labelBefore == null) input.dataset.labelBefore = item.label;
    item.label = input.value.slice(0, 80);
    save();
  });

  document.body.addEventListener("change", function (event) {
    var target = event.target;
    if (target.id === "import-file") {
      var file = target.files && target.files[0];
      target.value = "";
      if (!file) return;
      file.text().then(function (text) {
        var parsed;
        try {
          parsed = JSON.parse(text);
        } catch (parseErr) {
          throw new Error("That file is not valid JSON.");
        }
        var next = normalize(parsed, true);
        if (!confirm("Replace all data on this phone with this backup?")) return;
        state = next;
        ui.importError = "";
        ui.ringFrom = null;
        save();
        showToast("Backup imported.");
        render();
      }).catch(function (err) {
        ui.importError = err && err.message ? err.message : "Could not read that file.";
        render({ keepScroll: true });
      });
      return;
    }
    var group = target.closest("[data-item-group]");
    if (group) {
      var item = state.items.filter(function (it) { return it.id === group.dataset.itemGroup; })[0];
      if (!item || GROUPS.indexOf(group.value) === -1) return;
      item.group = group.value;
      state.items = state.items.filter(function (it) { return it.id !== item.id; }).concat(item);
      save();
      render({ keepScroll: true });
      return;
    }
    var pocs = target.closest("[data-item-pocs]");
    if (pocs) {
      var pocItem = state.items.filter(function (it) { return it.id === pocs.dataset.itemPocs; })[0];
      if (!pocItem) return;
      var n = Math.round(Number(pocs.value));
      if (!Number.isFinite(n) || n <= 0) delete pocItem.pocs;
      else pocItem.pocs = Math.min(99, n);
      save();
      render({ keepScroll: true });
      return;
    }
    var setting = target.closest("[data-setting]");
    if (setting) {
      var key = setting.dataset.setting;
      if (key === "startWeight" || key === "goalWeight") state[key] = round1(clampNum(setting.value, 80, 600, state[key]));
      if (key === "pocGoal") state.pocGoal = Math.round(clampNum(setting.value, 1, 100000, state.pocGoal));
      if (key === "pocBaseline") state.pocBaseline = Math.round(clampNum(setting.value, 0, 100000, state.pocBaseline));
      save();
      showToast("Saved.");
      render({ keepScroll: true });
    }
  });

  function scheduleLabelFinish(input) {
    if (!input) return;
    setTimeout(function () { finishLabelEdit(input); }, 120);
  }

  document.body.addEventListener("change", function (event) {
    var named = event.target.closest("[data-item-label]");
    if (named) scheduleLabelFinish(named);
    var field = event.target.closest("[data-field]");
    if (field) scheduleFieldFinish(field);
  });

  document.body.addEventListener("focusout", function (event) {
    var input = event.target.closest("[data-item-label]");
    if (input) scheduleLabelFinish(input);
    var field = event.target.closest("[data-field]");
    if (field) scheduleFieldFinish(field);
  });

  window.addEventListener("pagehide", function () {
    commitHabitLabels();
    commitOpenFields();
  });

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") {
      commitHabitLabels();
      commitOpenFields();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && ui.sheetDate) {
      ui.sheetDate = null;
      render({ keepScroll: true });
    }
  });

  window.addEventListener("hashchange", function () {
    var view = (location.hash || "#today").replace("#", "");
    ui.view = views[view] ? view : "today";
    ui.sheetDate = null;
    render();
  });

  window.addEventListener("resize", function () {
    if (ui.view === "weight" || ui.view === "goals") drawChart();
  });

  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    deferredPrompt = event;
    ui.canInstall = true;
    if (ui.view === "settings") render({ keepScroll: true });
  });

  function boot() {
    var shouldSave = false;
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        state = normalize(JSON.parse(raw));
        shouldSave = true;
      } else {
        state = fresh();
        shouldSave = true;
      }
    } catch (err) {
      state = fresh();
      shouldSave = false;
      setTimeout(function () { showToast("Saved data could not be read. Started clean."); }, 0);
    }
    if (shouldSave) save();
    if (!location.hash) history.replaceState(null, "", "#today");
    var view = (location.hash || "#today").replace("#", "");
    ui.view = views[view] ? view : "today";
    ui.month = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    render();
  }

  boot();
})();
</script>
</body>
</html>
